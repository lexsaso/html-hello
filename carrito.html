<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Tu Carrito | L'Élégance</title>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="sticky top-0 z-50 bg-white border-b border-gray-100">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-tighter uppercase">L'Élégance</a>
            <button id="menu-toggle" class="md:hidden p-2 rounded border border-gray-200" aria-label="Abrir menú">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div id="menu" class="hidden md:flex items-center space-x-6">
                <a href="index.html" class="text-sm uppercase font-bold">Inicio</a>
                <a href="catalogo.html" class="text-sm uppercase font-bold">Catálogo</a>
                <a href="carrito.html" class="relative">Carrito</a>
            </div>
        </nav>
        <div id="mobile-menu" class="md:hidden hidden px-6 pb-4">
            <a href="index.html" class="block py-2 text-sm uppercase font-bold">Inicio</a>
            <a href="catalogo.html" class="block py-2 text-sm uppercase font-bold">Catálogo</a>
            <a href="carrito.html" class="block py-2 text-sm uppercase font-bold">Carrito</a>
        </div>
        <script>
            const menuToggle = document.getElementById('menu-toggle');
            const mobileMenu = document.getElementById('mobile-menu');
            menuToggle.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        </script>
    </header>
    <main class="container mx-auto px-6 py-16">
        <h1 class="text-3xl font-bold mb-10 uppercase text-center">Tu Carrito</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 flex items-center shadow-sm">
                    <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=100" class="w-20 h-24 object-cover mr-6">
                    <div class="flex-1">
                        <h3 class="font-bold uppercase text-sm">Chaqueta Lino</h3>
                        <p class="text-gray-400 text-xs italic">Talla: M</p>
                    </div>
                    <p class="font-bold mx-6">120.00€</p>
                    <input type="number" value="1" class="w-12 border text-center">
                    <button class="ml-6 text-gray-300 hover:text-red-500 transition">×</button>
                </div>
                </div>

            <div class="bg-white p-8 shadow-sm h-fit">
                <h2 class="font-bold uppercase mb-6 border-b pb-4">Resumen</h2>
                <div class="space-y-4 text-sm">
                    <div class="flex justify-between"><span>Subtotal</span><span>120.00€</span></div>
                    <div class="flex justify-between"><span>Impuestos (IVA)</span><span>25.20€</span></div>
                    <div class="flex justify-between font-bold text-lg border-t pt-4"><span>Total</span><span>145.20€</span></div>
                </div>
                <a href="checkout.html" class="block bg-black text-white text-center w-full mt-8 py-4 uppercase font-bold text-sm tracking-widest">Comprar</a>
                <a href="catalogo.html" class="block text-center mt-4 text-xs underline uppercase">Continuar comprando</a>
            </div>
        </div>
    </main>
</body>
</html>
